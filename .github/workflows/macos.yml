name: macOS

# The macOS half of docs/AVALONIA-PLAN.md. Runs on demand from the Actions tab, and on every push to the
# avalonia branch. It builds whichever cross-platform projects the branch has and uploads the output, so
# there is something to download long before there's an .app bundle.

on:
  workflow_dispatch:
  push:
    branches: [avalonia]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # 10.0.400 with rollForward "latestFeature" in global.json: the newest 10.0 SDK is installed.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-macos-

      - name: Work out what this branch can build here
        # MdReader.Core is on every branch. MdReader.Shell, MdReader.Mac (the WKWebView backend) and
        # MdReader.Ui (the Avalonia shell) only exist on the port's branch. A project that targets Windows
        # only is skipped with a note rather than failing, so this workflow is green on main and stays green
        # as the port lands piece by piece. MdReader.Ui multi-targets, which is why the build below names a
        # framework: the default would also try net10.0-windows, which no macOS runner can build.
        run: |
          set -eo pipefail
          buildable=""
          for proj in \
            src/MdReader.Core/MdReader.Core.csproj \
            src/MdReader.Shell/MdReader.Shell.csproj \
            src/MdReader.Mac/MdReader.Mac.csproj \
            src/MdReader.Ui/MdReader.Ui.csproj
          do
            if [ ! -f "$proj" ]; then
              echo "not on this branch, skipping: $proj"
              continue
            fi
            if grep -Eq '<TargetFramework>[^<]*-windows</TargetFramework>' "$proj"; then
              echo "::notice title=Skipped on macOS::$proj targets Windows only (AVALONIA-PLAN.md phase 2 moves it to net10.0)."
              continue
            fi
            buildable="$buildable $proj"
          done
          echo "MDREADER_MAC_PROJECTS=${buildable# }" >> "$GITHUB_ENV"
          echo "will build:${buildable:- nothing}"

      - name: Build (Release)
        # Directory.Build.props sets TreatWarningsAsErrors, so a new warning fails the job.
        run: |
          set -eo pipefail
          for proj in $MDREADER_MAC_PROJECTS; do
            name=$(basename "$(dirname "$proj")")
            echo "::group::$name"
            dotnet build "$proj" --configuration Release --framework net10.0 --output "artifacts/macos/$name"
            echo "::endgroup::"
          done

      - name: Publish the shell for Apple silicon
        # Self-contained, because macOS ships no .NET runtime. This is the payload an .app bundle wraps.
        if: contains(env.MDREADER_MAC_PROJECTS, 'MdReader.Ui')
        run: |
          set -eo pipefail
          dotnet publish src/MdReader.Ui/MdReader.Ui.csproj --configuration Release --framework net10.0 \
            --runtime osx-arm64 --self-contained true --output artifacts/macos/publish

      # Phase 3 of docs/AVALONIA-PLAN.md turns the publish above into a real Mac download: lay out
      # artifacts/macos/MdReader.app/Contents/{MacOS,Resources} with an Info.plist (the .md UTI
      # declarations, which are also what makes application:openURLs: fire at all) and an .icns, and
      # optionally `hdiutil create` a .dmg. Until the bundle exists the shell can still be run from the
      # publish folder for a smoke test, but LaunchServices only keeps a *bundled* application to one
      # instance, so file association and "open a second copy" behave like a plain executable until then.
      #
      # Signing and notarization come later. They need an Apple Developer account ($99/year) and repository
      # secrets this workflow deliberately doesn't use yet: the Developer ID certificate (.p12 plus its
      # password) for `codesign`, and an App Store Connect API key for `xcrun notarytool`. Until that is
      # set up the artifact is unsigned and macOS will quarantine it (right-click, Open).

      - name: Upload the build output
        uses: actions/upload-artifact@v7
        with:
          name: mdreader-macos-${{ github.sha }}
          path: artifacts/macos
          if-no-files-found: error
          retention-days: 14
