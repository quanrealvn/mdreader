# MdReader web version on fly.io. Deploy from the repo root with `fly deploy` (remote builder).

app = "mdreader"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # Production rate limit per client (a 2 MB render costs seconds of CPU on one shared vCPU).
  Limits__RendersPerWindow = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # One page load fetches ~15 small files; the app limits renders itself (per client and server-wide).
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
